services:
  pulse:
    build: .
    image: ghcr.io/nanikumar4568/pulse:latest
    container_name: pulse
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/pulse.db
      TICK_MS: 5000
      # SEED_ON_START: "1"   # uncomment for a populated demo on first boot
      # ADMIN_TOKEN: change-me   # uncomment to require a token for mutations
      # WEBHOOK_URL: https://hooks.example.com/pulse   # incident alerts
    volumes:
      - pulse-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pulse-data:
