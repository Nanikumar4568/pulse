<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse — Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1220'/%3E%3Cpath d='M5 17h5l3-8 4 15 3-7h7' stroke='%2338d39f' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 4 14 2.5-7h5"/></svg>
      </span>
      <div>
        <h1>Pulse</h1>
        <div class="sub">dashboard</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="on">Dashboard</a>
      <a href="/status">Status page</a>
    </nav>
  </header>

  <div class="banner">
    <span class="dot nodata" id="bannerDot"></span>
    <h2 id="bannerText">Loading…</h2>
    <div class="meta" id="bannerMeta"></div>
  </div>

  <div class="summary">
    <div class="stat"><div class="k">Monitors</div><div class="v" id="sMonitors">–</div></div>
    <div class="stat"><div class="k">Uptime 90d</div><div class="v" id="sUptime">–</div></div>
    <div class="stat"><div class="k">Open incidents</div><div class="v" id="sIncidents">–</div></div>
    <div class="stat"><div class="k">Checks run</div><div class="v" id="sChecks" style="font-size:14px">–</div></div>
  </div>

  <h3 class="section-title">Monitors</h3>
  <div id="monitors"><div class="empty">Loading…</div></div>

  <h3 class="section-title">Add a monitor</h3>
  <form class="panel" id="addForm" autocomplete="off">
    <div class="form-row">
      <div>
        <label for="f-name">Name</label>
        <input id="f-name" name="name" placeholder="API gateway" required maxlength="80">
      </div>
      <div>
        <label for="f-url">URL</label>
        <input id="f-url" name="url" placeholder="https://example.com/health" required>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label for="f-expect">Expected status</label>
        <input id="f-expect" name="expectStatus" type="number" value="200" min="100" max="599">
      </div>
      <div>
        <label for="f-interval">Check every (seconds)</label>
        <select id="f-interval" name="intervalS">
          <option value="30">30 seconds</option>
          <option value="60" selected>60 seconds</option>
          <option value="300">5 minutes</option>
          <option value="900">15 minutes</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <button type="submit" id="addBtn">Add monitor</button>
      <button type="button" class="ghost" id="testBtn">Test URL first</button>
      <span id="formMsg"></span>
    </div>
  </form>

  <p class="foot">Pulse — self-hosted uptime monitoring · <a href="/status">public status page</a></p>
</div>
<script src="/app.js"></script>
</body>
</html>
